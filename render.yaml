databases:
  - name: gestion-academica-db
    plan: free
    databaseName: gestion_academica
    user: gestion_academica_user

services:
  - type: web
    name: gestion-academica
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-academica-db
          property: connectionString
